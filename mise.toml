[tools]
node = "26.11.1"
pnpm = "12.14.0"

[env]
BASE_URL = "http://localhost:4783"
AUTH_SECRET = "mage-development-secret-do-not-use-in-production"
CREDENTIAL_KEY = "bWFnZS1kZXZlbG9wbWVudC1vbmx5LWNyZWRlbnRpYWw="
LOG_FORMAT = "pretty"

[vars]
# Extra arguments for the dev server.
dev_args = ""
# Where the browser and the dev server reach the mock's identity provider.
sso_url = "http://localhost:4800"
# Where the browser loads artifacts from: an origin per artifact, a subdomain of localhost the dev
# server answers on its own port.
artifact_url = "http://*.localhost:4783"
# A second port to serve artifacts on, for hosts without wildcard names; empty for none.
artifact_port = ""

[tasks.setup]
description = "Install dependencies"
run = ["pnpm install", "pnpm exec playwright install chromium"]

[tasks.dev]
description = "Run the app with hot reload"
depends = ["deps:ready"]
run = [{ tasks = ["dev:app", "dev:mock"] }]

[tasks."dev:app"]
description = "Run the app with hot reload"
hide = true
# The app reads the identity provider's discovery once, as it starts.
run = """
set -eu
until curl -fs -o /dev/null "$OIDC_ISSUER/.well-known/openid-configuration"; do sleep 1; done
exec pnpm dev {{vars.dev_args}}
"""

[tasks."dev:app".env]
_.file = "configs/.dev.env"
ARTIFACT_PORT = "{{vars.artifact_port}}"
ARTIFACT_ORIGIN = "{{vars.artifact_url}}"
OIDC_ISSUER = "{{vars.sso_url}}"
# Jaeger takes traces only.
OTEL_EXPORTER_OTLP_ENDPOINT = "http://localhost:4318"
OTEL_METRICS_EXPORTER = "none"
OTEL_LOGS_EXPORTER = "none"

[tasks."dev:mock"]
description = "Run the stand-ins for the systems the app talks to"
hide = true
run = "node --watch-path=mock mock/main.ts mock/dev.yaml"

[tasks."dev:mock".env]
_.file = "configs/.dev.env"
SSO_URL = "{{vars.sso_url}}"

[tasks."deps:compose"]
description = "Compose command for the dev dependencies"
hide = true
run = """
set -eu
exec $(command -v podman || echo docker) compose -f deps.dev.yaml "$@"
"""

[tasks."deps:up"]
description = "Run the dev dependencies in the foreground"
usage = 'arg "[service]..." help="Services to run; all when none" var=#true'
run = "mise run deps:compose up ${usage_service:-}"

[tasks."deps:ready"]
description = "Wait until the dev dependencies answer"
hide = true
run = """
set -eu
until curl -fs -o /dev/null http://localhost:16686; do
  echo "Waiting for the dev dependencies; start them with: mise run deps:up" >&2
  sleep 3
done
"""

[tasks."deps:down"]
description = "Stop the dev dependencies"
run = "mise run deps:compose down"

[tasks.build]
description = "Build for production"
run = "pnpm build"

[tasks.check]
description = "Lint, format check and type check"
run = "pnpm check"

[tasks.test]
description = "Run the tests"
run = "pnpm test"

[tasks.e2e]
description = "Run the browser journeys"
run = "pnpm e2e"

[tasks."db:generate"]
description = "Generate a migration from schema changes"
run = "pnpm db:generate"

[tasks."models:update"]
description = "Refresh the vendored model data"
run = "node scripts/update-models.ts"

[tasks."icons:update"]
description = "Refresh the vendored icons"
run = "node scripts/update-icons.ts"
