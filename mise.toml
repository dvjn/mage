[tools]
node = "26.11.1"
pnpm = "12.14.0"

[env]
BASE_URL = "http://localhost:4783"
AUTH_SECRET = "mage-development-secret-do-not-use-in-production"
CREDENTIAL_KEY = "bWFnZS1kZXZlbG9wbWVudC1vbmx5LWNyZWRlbnRpYWw="
LOG_FORMAT = "pretty"

[vars]
# Extra arguments for the dev server.
dev_args = ""
# Where the browser and the dev server reach the dev identity provider.
sso_url = "http://localhost:9000"

[tasks.setup]
description = "Install dependencies and the browser for the journeys"
run = ["pnpm install", "pnpm exec playwright install chromium"]

[tasks.dev]
description = "Run API and web client with hot reload on :4783, signing in through the dev identity provider"
depends = ["deps:up"]
env = { _.file = "configs/.dev.env", OIDC_ISSUER = "{{vars.sso_url}}/application/o/mage/" }
run = "pnpm dev {{vars.dev_args}}"

[tasks."deps:up"]
description = "Start the dev identity provider on :9000 (Authentik: akadmin, ada, grace, alice, bob)"
run = """
set -eu
compose="$(command -v podman || echo docker) compose --env-file configs/.dev.env -f deps.dev.yaml"
$compose up -d
until curl -fs -o /dev/null http://localhost:9000/application/o/mage/.well-known/openid-configuration; do
  sleep 3
done
"""

[tasks."deps:down"]
description = "Stop the dev identity provider, keeping its database"
run = "$(command -v podman || echo docker) compose --env-file configs/.dev.env -f deps.dev.yaml down"

[tasks."deps:reset"]
description = "Stop the dev identity provider and remove its database"
run = "$(command -v podman || echo docker) compose --env-file configs/.dev.env -f deps.dev.yaml down --volumes"

[tasks."deps:logs"]
description = "Follow the dev identity provider's logs"
run = "$(command -v podman || echo docker) compose --env-file configs/.dev.env -f deps.dev.yaml logs -f"

[tasks.build]
description = "Build the web client and the server into dist"
run = "pnpm build"

[tasks.start]
description = "Serve the API and the built client (run build first)"
run = "pnpm start"

[tasks.check]
description = "Lint, format check and type check"
run = "pnpm check"

[tasks.test]
description = "Run the test suite"
run = "pnpm test"

[tasks.e2e]
description = "Run the browser journeys against a production build on :4793"
run = "pnpm e2e"

[tasks."db:generate"]
description = "Generate a migration from schema changes"
run = "pnpm db:generate"

[tasks."models:update"]
description = "Refresh the vendored model data from LiteLLM's model map"
run = "node scripts/update-models.ts"

[tasks."icons:update"]
description = "Write the makers' and hosts' marks from the pinned Lobe Icons release"
run = "node scripts/update-icons.ts"
