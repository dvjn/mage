# Mage as an OpenID Connect application in Authentik that SCIM provisions with the people of two
# groups, and the groups themselves; two users, one in each, and two in neither who match Mage
# accounts made with a password.
version: 1
metadata:
  name: Mage demo
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: mage-oidc
    identifiers:
      name: Mage
    attrs:
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      client_id: mage
      client_secret: !Env MAGE_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:4783/api/auth/callback/oidc
        - matching_mode: strict
          url: http://localhost:4795/api/auth/callback/oidc
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-email],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-profile],
          ]

  - model: authentik_core.group
    id: engineering
    identifiers:
      name: Engineering

  - model: authentik_core.group
    id: design
    identifiers:
      name: Design

  - model: authentik_providers_scim.scimprovider
    id: mage-scim
    identifiers:
      name: Mage directory
    attrs:
      url: http://host.containers.internal:4783/api/auth/scim/v2
      auth_mode: token
      token: !Env MAGE_SCIM_TOKEN
      exclude_users_service_account: true
      property_mappings:
        - !Find [
            authentik_providers_scim.scimmapping,
            [managed, goauthentik.io/providers/scim/user],
          ]
      property_mappings_group:
        - !Find [
            authentik_providers_scim.scimmapping,
            [managed, goauthentik.io/providers/scim/group],
          ]
      group_filters:
        - !KeyOf engineering
        - !KeyOf design

  - model: authentik_core.application
    identifiers:
      slug: mage
    attrs:
      name: Mage
      provider: !KeyOf mage-oidc
      backchannel_providers:
        - !KeyOf mage-scim
      meta_launch_url: http://localhost:4783/

  - model: authentik_core.user
    identifiers:
      username: alice
    attrs:
      name: Alice Example
      email: alice@example.com
      password: !Env MAGE_USER_PASSWORD
      groups:
        - !KeyOf engineering

  - model: authentik_core.user
    identifiers:
      username: bob
    attrs:
      name: Bob Example
      email: bob@example.com
      password: !Env MAGE_USER_PASSWORD
      groups:
        - !KeyOf design

  # Ada and Grace had Mage password accounts before OIDC; signing in here reaches those accounts by
  # email. They are in no group, so the directory leaves them alone.
  - model: authentik_core.user
    identifiers:
      username: ada
    attrs:
      name: Ada Lovelace
      email: demo@mage.test
      password: !Env MAGE_USER_PASSWORD

  - model: authentik_core.user
    identifiers:
      username: grace
    attrs:
      name: Grace Hopper
      email: grace@mage.test
      password: !Env MAGE_USER_PASSWORD
