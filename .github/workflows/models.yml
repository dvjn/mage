name: 🧠 Model Data

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-model-data
  cancel-in-progress: false

jobs:
  refresh:
    name: 🧠 Refresh Model Data
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.AUTOMATION_TOKEN }}

      - name: 🧰 Install Tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔄 Refresh Model Data
        run: mise run models:update

      - name: ✅ Test Model Data
        run: pnpm exec vp test src/shared/hosts.test.ts scripts/update-models.test.ts

      - name: 📝 Open or Update Pull Request
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          PR_BRANCH: automation/model-data
        run: |
          if git diff --quiet -- src/server/models/data/models.json; then
            echo "Model data is current."
            exit 0
          fi

          git config user.name "$(gh api user --jq 'if (.name // "") == "" then .login else .name end')"
          git config user.email "$(gh api user --jq 'if (.email // "") == "" then "\(.id)+\(.login)@users.noreply.github.com" else .email end')"
          git fetch origin "+refs/heads/$PR_BRANCH:refs/remotes/origin/$PR_BRANCH" || true
          git switch --create "$PR_BRANCH"
          git add src/server/models/data/LICENSE src/server/models/data/models.json
          git commit --message "chore: refresh vendored model data"
          git push --force-with-lease origin "$PR_BRANCH"

          if gh pr list --head "$PR_BRANCH" --state open --json number --jq 'length' | grep -qx 0; then
            gh pr create \
              --base main \
              --head "$PR_BRANCH" \
              --title "chore: refresh vendored model data" \
              --body $'Refresh the vendored model data.\n\nThe scheduled model data workflow generated and tested this change.'
          fi
